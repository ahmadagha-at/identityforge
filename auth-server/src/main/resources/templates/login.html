<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><title>IdentityForge Sign In</title></head>
<body>
<main>
  <h1>Sign in to IdentityForge</h1>
  <p th:if="${param.error}">Authentication failed. Check your credentials or try again later.</p>
  <p th:if="${param.logout}">You have signed out.</p>
  <p th:if="${param.registered}">Registration completed. You can now sign in.</p>
  <form method="post" th:action="@{/login}">
    <label>Username <input name="username" required autocomplete="username"></label><br>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label><br>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Sign in</button>
  </form>
  <a th:href="@{/register}">Create an account</a>
</main>
</body>
</html>
