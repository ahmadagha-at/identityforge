<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><title>IdentityForge Client</title></head>
<body>
<main>
  <h1>IdentityForge Client Application</h1>
  <section th:if="${!authenticated}">
    <p>This application demonstrates Authorization Code, PKCE, and OpenID Connect.</p>
    <a href="/oauth2/authorization/identityforge">Sign in with IdentityForge</a>
  </section>
  <section th:if="${authenticated}">
    <p>Authenticated subject: <code th:text="${subject}"></code></p>
    <a href="/profile">Open protected profile</a>
    <details><summary>ID Token claims</summary><pre th:text="${claims}"></pre></details>
    <form method="post" th:action="@{/logout}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit">Sign out</button>
    </form>
  </section>
</main>
</body>
</html>
